name: Release package

# Publishing a GitHub release tagged vX.Y.Z (or X.Y.Z) builds pkg_drekmeta-X.Y.Z.zip plus updates.xml and attaches
# both to that release. The tag is the single source of truth for the version: it's stamped into all manifests.
#
# Joomla's update server is https://github.com/<repo>/releases/latest/download/updates.xml, so every site with the
# package installed sees a new stable release under System -> Update -> Extensions. Prereleases never become
# "latest", so they don't reach those sites.
#
# Run it by hand (Actions -> Release package -> Run workflow) to get both files as a build artifact without releasing.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp into the manifests (e.g. 1.0.1)
        required: true
        default: 0.0.0-dev

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build pkg_drekmeta
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Resolve version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          RAW="${RELEASE_TAG:-$INPUT_VERSION}"
          VERSION="${RAW#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$RAW' isn't a version. Tag releases like v1.2.3."
            exit 1
          fi

          # Joomla's update stability levels: dev, alpha, beta, rc, stable.
          case "${VERSION,,}" in
            *dev*)   STABILITY=dev ;;
            *alpha*) STABILITY=alpha ;;
            *beta*)  STABILITY=beta ;;
            *rc*)    STABILITY=rc ;;
            *)       STABILITY=stable ;;
          esac

          {
            echo "version=$VERSION"
            echo "tag=${RELEASE_TAG:-v$VERSION}"
            echo "stability=$STABILITY"
          } >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION ($STABILITY)"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Lint PHP
        run: find src -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check JavaScript syntax
        run: for f in src/com_drekmeta/media/js/*.js; do node --check "$f"; done

      # ubuntu-latest has no xmllint; PHP's libxml parser is just as strict and already set up.
      - name: Validate XML manifests and forms
        run: |
          php -r '
            libxml_use_internal_errors(true);
            $failed = 0;
            $files  = new RegexIterator(new RecursiveIteratorIterator(new RecursiveDirectoryIterator("src")), "/\.xml$/");
            foreach ($files as $file) {
                if (simplexml_load_file((string) $file) === false) {
                    foreach (libxml_get_errors() as $e) {
                        printf("::error file=%s,line=%d::%s\n", $file, $e->line, trim($e->message));
                    }
                    libxml_clear_errors();
                    $failed++;
                    continue;
                }
                echo "ok  $file\n";
            }
            exit($failed ? 1 : 0);
          '

      - name: Stamp version and update server
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          DATE="$(date -u +%Y-%m)"
          for manifest in src/pkg_drekmeta.xml src/com_drekmeta/drekmeta.xml src/plg_system_drekmeta/drekmeta.xml; do
            sed -i -E \
              -e "0,/<version>[^<]*<\/version>/s//<version>${VERSION}<\/version>/" \
              -e "0,/<creationDate>[^<]*<\/creationDate>/s//<creationDate>${DATE}<\/creationDate>/" \
              "$manifest"
            grep -H '<version>' "$manifest"
          done
          sed -i -E "s/\"version\": \"[^\"]*\"/\"version\": \"${VERSION}\"/" src/com_drekmeta/media/joomla.asset.json

          # Point the update server at the repository this runs in, so forks update from themselves.
          SERVER="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/latest/download/updates.xml"
          sed -i -E "s#https://[^<]*/releases/latest/download/updates\.xml#${SERVER}#" src/pkg_drekmeta.xml
          grep -H 'updates.xml' src/pkg_drekmeta.xml

      - name: Build zips
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/build"
          STAGE="$OUT/stage"
          mkdir -p "$STAGE/packages"

          # -X leaves out extra file attributes, -x '.*' skips dotfiles.
          (cd src/com_drekmeta && zip -rqX "$STAGE/packages/com_drekmeta.zip" . -x '.*')
          (cd src/plg_system_drekmeta && zip -rqX "$STAGE/packages/plg_system_drekmeta.zip" . -x '.*')

          cp src/pkg_drekmeta.xml src/script.php "$STAGE/"
          cp -r src/language "$STAGE/"

          PACKAGE="$OUT/pkg_drekmeta-${VERSION}.zip"
          (cd "$STAGE" && zip -rqX "$PACKAGE" .)

          echo "Package contents:"
          unzip -l "$PACKAGE"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          echo "PACKAGE=$PACKAGE" >> "$GITHUB_ENV"

      - name: Write Joomla update manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          STABILITY: ${{ steps.version.outputs.stability }}
        run: |
          set -euo pipefail
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          SHA256="$(sha256sum "$PACKAGE" | cut -d' ' -f1)"

          # targetplatform is matched as ^regex against the Joomla version: 4.4.x, 5.x and 6.x.
          cat > "$OUT/updates.xml" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <updates>
          	<update>
          		<name>DREK Meta</name>
          		<description>DREK Meta ${VERSION}</description>
          		<element>pkg_drekmeta</element>
          		<type>package</type>
          		<version>${VERSION}</version>
          		<client>site</client>
          		<infourl title="DREK Meta ${VERSION}">${REPO_URL}/releases/tag/${TAG}</infourl>
          		<downloads>
          			<downloadurl type="full" format="zip">${REPO_URL}/releases/download/${TAG}/pkg_drekmeta-${VERSION}.zip</downloadurl>
          		</downloads>
          		<sha256>${SHA256}</sha256>
          		<tags>
          			<tag>${STABILITY}</tag>
          		</tags>
          		<maintainer>drek124</maintainer>
          		<maintainerurl>https://github.com/drek124</maintainerurl>
          		<targetplatform name="joomla" version="(4\.4|5|6)\." />
          		<php_minimum>8.1</php_minimum>
          	</update>
          </updates>
          EOF

          php -r 'exit(simplexml_load_file($argv[1]) === false ? 1 : 0);' "$OUT/updates.xml"
          cat "$OUT/updates.xml"

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release upload "$TAG" "$PACKAGE" "$OUT/updates.xml" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload build artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: pkg_drekmeta-${{ steps.version.outputs.version }}
          path: |
            ${{ env.PACKAGE }}
            ${{ env.OUT }}/updates.xml
          if-no-files-found: error
